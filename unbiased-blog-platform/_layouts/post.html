---
layout: default
---
<section class="post-header">
  <div class="wrap">
    <a href="/blog/" class="back-link">← All posts</a>
    <div class="eyebrow"><span class="idx">{{ page.category | default: "Notes" }}</span></div>
    <h1>{{ page.title }}</h1>
    <div class="post-meta">{{ page.date | date: "%B %-d, %Y" }}</div>
  </div>
</section>

<article class="post-body">
  <div class="wrap">
    {{ content }}
  </div>
</article>
